const NEWS=[{"m":"115年1月","n":7,"items":[{"s":"土方之亂","a":"1.解土方之亂政院提3策略 建置公有暫置場年前啟用\n2.中部區域聯防 土方之亂有解\n3.土方填築港區 蘇俊賓：應調查水文影響\n4.土方擬大量開放港區填築 蘇俊賓：盡早部署生態調查\n5.免費回填的真相：什麼土能進農地？ 釐清土方管理，民間呼籲立專法","u":"農村規劃組","d":"115/01/30","st":"存參","p":"農村規劃組於115.1.30回應","k":"一、有關農地改良填土土質已明定於農業發展條例施行細則第2條之1，即農業用地為從事農業使用而有填土需要者，其填土土質應為適合種植農作物之土壤，不得為砂、石、磚、瓦、混凝土塊、營建剩餘土石方、廢棄物或其他不適合種植農作物之物質，並不因土地所在區位等因素而有不同。\n二、農業部已於115年1月20日澄清，並於115年1月26重申，基於營建剩餘土石方內含物質是否安全，仍有疑慮，故現行政策方向及規定沒有改變，亦無規劃放寬前開施行細則第2條之1相關規定，即非屬適合種植農作物之物質，均不得以改良名義回填於農地，以確保農業生產環境安全。\n三、另土壤為天然化育而成，農業生產自以原生土壤為佳，應無農地須大量填埋外來物質以進行改良之情形，且農地整地行為應以挖填平衡為原則，故農地改良與營建剩餘土石方去化無關，係為二事，不宜混為一談。"},{"s":"警方揭露西湖鄉違法開發3公頃山坡地 苗縣府依水保法重罰30萬元","a":"苗栗縣道128線旁西湖鄉高埔段約3公頃山坡地，地主違法未經申請即開挖，並回填一般土石方，警方通報縣府今天查獲，除勒令停工，縣府將依水土保持法最重30萬元裁罰，並連續處分至改正，並限期恢復植生。","u":"坡地管理組","d":"115/01/27","st":"存參","p":"坡地管理組於115.1.27回應。","k":"一、於山坡地從事開發行為，應依水保法第12條規定擬具水保計畫送審後實施；另依同第35條及其施行細則第38條規定，違規查報、制止及取締，係苗栗縣政府(下稱縣府)權責。\n二、經洽縣府瞭解，相關處理作為如下：\n(1)案地位於苗栗縣西湖鄉新高埔段2211-20、1122-23、2211-18、2211-22、2211-19、2211-17、2211-16、2418地號等8筆土地，縣府於115.1.26接獲警方通報立即前往現勘，確認未經申請擅自開挖整地，並堆置大量來源不明的土方，違規面積約2.9221公頃。\n(2)縣府已勒令現場停工，並將依水保法裁罰30萬元，後續將嚴格要求水土保持義務人限期3個月恢復植生，倘屆期未改正，將連續處分至改正為止。\n三、經查本署衛星影像變異點監測，本案115.1.10與前期影像比對尚無變異情形，故應屬近期違規行為，將循違規處理既有通報機制，於今（27）日函請該府積極辦理，並以系統列管追蹤辦理情形至結案。\n四、應辦事項：本案違反水保法之查報取締係屬地方政府權責，本組將持續掌握相關輿情訊息並及時回應。"},{"s":"「廢弛職務、卸責地方」花蓮縣府揭洪災內幕 要檢調查辦行政院","a":"去年9月23日發生花蓮馬太鞍溪堰塞湖災害，據「鏡周刊」報導，偵辦層級或上升到花蓮縣長徐榛蔚，朝向廢弛職務釀成災害偵辦。花蓮縣政府今提出10重點，嚴正質疑中央廢弛職務、卸責地方，籲檢調依法一視同仁查辦行政院。","u":"減災監測組","d":"115/01/27","st":"存參","p":"減災監測組於115.1.27回應。","k":"一、堰塞湖致災型態與規模，屬「低頻高衝擊」之災害，相較土石流、大規模崩塌等災害，堰塞湖具有以下特性：\n（一）發生頻率低、但單一事件影響範圍大，潰決後可能影響整個流域中下游。\n（二）致災時間具高度不確定性，可能長期存在後才發生溢流或潰決等「非即時致災、延遲性高風險」的特性。\n（三）發生後不一定以工程處置，因地制宜結合自然消散、長期監測與生態考量。\n此類型災害無法直接套用既有土石流或大規模崩塌既有的警戒發布、避難啟動與常時演練制度，據此，在堰塞湖尚未成為法定災害前，其防災相關作業應依行政院農業委員會101年7月4日農林務字第1011730362號函修訂之「堰塞湖警戒、監測及撤離與演練方案」據以執行為宜。其中分工明訂：堰塞湖之警戒、監測由權責機關負責，撤離地點之擇定與演練等由地方負責，並由中央協助指導。\n二、考量堰塞湖屬「低頻高衝擊」之災害，部份整備工作地方政府參考「農業部土石流及大規模崩塌防災疏散避難作業規定」之成果以利防災工作推動，本署尊重其做法。惟前開規定有關防災整備工作分工，中央係以警戒發布為主；避難收容處所選定及整備、規劃疏散路線、保全住戶名冊建置及疏散人員編組係以地方政府為主體，中央為輔導及支援之角色。"},{"s":"聯合報記者李柏毅採訪","a":"採訪內容：何謂農地改良，以及營建剩餘土石方回填農地事宜?","u":"農村規劃組","d":"115/01/20","st":"存參","p":"農村規劃組蔡秀婉組長於115.1.20回應。","k":"一、農地改良，係農地若有地勢低漥不利耕作、土質不佳或土壤肥力不足影響產量情形，會透過填適合耕作的土壤，改善土壤深度、土壤質地或有機質含量等情形，以改善農耕環境，提高農地生產力。\n二、如何證明農地改良填的是「適合耕作的土壤」，填的土方，申請人須向縣市政府申請，且須檢具合格土資場出具證明文件，並經檢驗合格，排除有重金屬或有毒物質等情形，並予佐證後，始得回填。此外，農地改良填土需考量高度，不得高於鄰田或影響毗鄰農田灌排水系統。\n三、因農地改良填入的土方量及土壤質地，會因區域或土壤現況之特性而有不同，現行農地改良之受理機關為縣市政府，目前多數縣市政府都有農地改良之申請及審查操作機制。\n四、由於營建剩餘土石方參雜物質非常多，非屬適合耕種之土方，不可以逕回填農業用地，目前農業部亦無修正農業發展條例施行細則第2條之1規定之情形。"},{"s":"苗栗南莊山林遭非法濫墾！邊坡切削呈直角恐崩塌","a":"苗栗縣南莊鄉西村一處山林地近日被民眾發現疑遭人為濫墾，邊坡遭大幅切削、道路幾近呈直角，開挖面積約達數座籃球場，引發地方關切。苗栗縣政府今(16)日說明，本案已在月初由南莊鄉公所第一時間巡查通報後查處。","u":"坡地管理組","d":"115/01/17","st":"存參","p":"坡地管理組於115.1.17回應。","k":"一、權責：本案山坡地違規擅自開發之查報、制止及取締，係苗栗縣政府權責，依水保法規定可裁處6-30萬元、限期改正，如致生水土流失、竊占等移送法辦。\n二、查處：案地位於苗栗縣南庄鄉桌山段20-41地號及大屋坑小段35地號，縣府前於115.1.7現勘，確認擅自開挖整地(約1,500~1,600平方公尺)，因部分屬林保署新竹分署管理土地，故將釐清行為人(義務人)及土地合法使用權(是否竊占)等，會同水保服務團確認違規事實(含評估是否致生水土流失)，續依水保法相關規定積極辦理。\n三、督導：本署已比對115.1.3與114.12.24前後期衛星影像，判釋該土地確有變異情形，將循變異點既有通報機制及系統列管，並追縱辦理情形至結案。"},{"s":"4座籃球場山林被剷光！南莊道路邊坡裸露 國有地也遭殃","a":"苗栗縣議員陳光軒獲報，南庄鄉西村一處山林地，遭人為濫墾；他今（15）日前往驚見翠綠山林成光禿禿一片，要求縣府依法嚴格處罰。縣府水利處表示，縣府已於2週前接獲檢舉，並隨即展開查處作為，經查違規面積約1500到1600平方公尺，換算約4座籃球場大小，當中並有涉及國有地，已通知地主明天到縣府說明，後續依法追究相關責任。縣府並提醒民眾若於山坡地或森林區內從事整地等相關行為，請依規定申請水土保持計畫。","u":"坡地管理組","d":"115/01/15","st":"存參","p":"坡地管理組於115.1.15日回應","k":"一、於山坡地從事開發行為，應依水保法第12條規定擬具水保計畫送審後實施；另依同第35條及其施行細則第38條規定，違規查報、制止及取締，係苗栗縣政府(下稱縣府)權責。\n二、經洽縣府瞭解，相關處理作為如下：\n(1)案地位於苗栗縣南庄鄉桌山段20-41地號及大屋坑小段35地號等土地，前於115年1月7日辦理現勘，確認遭人擅自開挖整地，違規面積約1,500~1,600平方公尺，且部分屬林保署新竹分署管理之國有土地，涉及違反水保法第12條及第32條規定，惟土地所有權人未到場。\n(2)縣府再訂於1月16日請土地所有權人到府說明，以釐清行為人以及是否有取得土地合法使用權等事項；並另請水保服務團專業技師，協助評估有無致生水土流失之情形，相關結果將納入違規處理之參據。\n(3)縣府表示，本案俟違規行為人等事項釐清後，即依水保法規定辦理，並要求限期改正，以確保安全。\n三、應辦事項：本案違反水保法之查報取締係屬地方政府權責，本組將持續掌握相關輿情訊息並及時回應。"},{"s":"協調中央全力支援古坑草嶺森林火警 劉建國：確保救災安全優先","a":"已燒毀約5公頃林地，雲林縣古坑鄉草嶺地區發生森林火警，起火地點位於石壁大飯店後方山區。由於當地地形陡峭、林相密集，加上目前正值冬季乾燥季節，增加火勢延燒與救災作業的困難度。立法委員劉建國表示，消防單位接獲通報後即投入搶救行動，並出動多輛消防車及人力進入山區救援。火勢於12日下午一度獲得控制，但因山區缺乏水源、地勢險峻，今日仍持續投入人力警戒與撲滅殘火。","u":"南投分署","d":"115/01/13","st":"存參","p":"南投分署於115.1.13回應。","k":"一、聯繫雲林縣古坑鄉草嶺村陳兵通村長，表示起火位置在木馬古道下方坡面，暫時不影響農村聚落，目前雲林縣消防局已控制住火燒範圍。\n二、並電洽嘉義林保署，表示經查火警地點屬於雲林縣政府的公有地，今（13）日中午應縣府需求，林保署已派轄內奮起湖工作站2名人員至現場協助。\n三、有關火災影響範圍包含有雲林縣政府近年推動「草嶺石壁森林療癒基地」，本署未來會視草嶺、石壁社區及石壁休閒農業區需求，給予辦理後續相關協助。"}]},{"m":"115年2月","n":2,"items":[{"s":"特定工廠合法化 經部月底函釋標準","a":"全國上千家位於農產業群聚地區的特定工廠，在申請用地變更合法化過程中，竟因「限以隔離綠帶規劃」規定如何並行，中央與地方對法規解讀不同，審查進度受阻。經濟部產業發展署承諾，將於二月底前發函釋示，統一全國審查標準。","u":"農村規劃組","d":"115/02/12","st":"存參","p":"農村規劃組於115.2.12回應。","k":"一、依農業主管機關同意農業用地變更使用審查作業要點規定，農業用地變更使用應至少留設一、5公尺且面積不少於申請面積30%之隔離綠帶或隔離設施，且得為通路等非建築之開放性設施。故農業用地變更廠房之出入口，倘以隔離設施方式設置，尚無牴觸農變要點之規定。\n二、本案爭議係因經濟部主管之「特定工廠申請變更編定為特定目的事業用地審查辦法」第6條規定，申請特定工廠之土地，位於農產業群聚地區者，與相鄰農業用地限以隔離綠帶規劃，爰造成特定工廠廠區出入口應如何設置規劃產生疑義。\n三、本案前經經濟部於1月30日邀集相關單位進行會議研商，並有研商共識：對於位於農產業群聚地區之特定工廠，如係配合建築法規就出入口通行範圍，有適當之舖築，尚不違反特定工廠用地辦法規定；其為通案性之處理，後續由經濟部以通函解釋。故昨日協調會，經濟部允諾2月底完成通函解釋。"},{"s":"公共電視台記者李婕綾採訪","a":"採訪內容：土石流防災專員的參加資格、培訓、工作內容，有哪些不同的挑戰及未來農村水保署的規劃。","u":"減災監測組","d":"115/02/05","st":"存參","p":"減災監測組陳振宇組長於115.2.5回應。","k":"一、說明為強化地方社區自主防災能力，本署辦理招募並培訓土石流防災專員，就參與培訓的資格及培訓時課程等內容解說，以及介紹土石流防災專員平時及災時在不同時間所需執行之任務的差異。\n二、於採訪中其述說土石流防災專員帶來的防災量能及本署後續精進作為，積極透過多元招募優化組成結構，並鼓勵女性、青年及新住民擔任土石流防災專員，並說明過去及現在土石流防災專員的挑戰，以及本署對於土石流防災專員未來之展望。\n三、應辦事項：將關注採訪播出內容。"}]},{"m":"115年3月","n":2,"items":[{"s":"桃園大溪康莊百年埤塘生態危機：水路遭割裂，金牌農村食農教育典範恐蒙塵","a":"位於桃園市大溪區康莊休閒農業區內的金牌農村，一口承載百年歷史的埤塘，不僅是地景記憶，更是維繫區域農業生態、支撐\"食農教育\"國家典範的核心命脈。近日，這口埤塘及其周邊公共通道，因土地產權變更與不當分割，面臨水路、路網遭人為割裂封鎖的危機，不僅衝擊農業生產基礎，更危及得來不易的一級生態與食農教育發展成果。","u":"臺北分署","d":"115/03/23","st":"存參","p":"臺北分署於115.3.23回應。","k":"一、經詢問地方人士，該埤塘因土地產權分割的問題，造成2地主間產生嫌隙。\n二、文中所述，新地主以土地私有為由，開始進行以下行為:「區隔水路，破壞灌溉系統」、「封路縮道，妨礙公共通行」。據悉，該埤塘近年來早已乾涸無水，係因埤塘上游水源自遠處流下，途經諸多用戶截水使用，致使埤塘水源日漸枯竭。另地主在埤塘外圍路口設置阻隔設施，為阻擋對方車輛進入，但行人仍可通行。\n三、文中所述:「分署特別在此投資興建觀景平臺與食農教育場域」、「食農教育根基動搖，生產環境與教育場域被硬生生割裂」。分署所施設的平台並未位於係爭土地上，社區平時經常性辦理生態體驗及導覽活動，該埤塘入口雖經地主設置阻隔設施，但行人仍可通行，亦有其他路線可繞行，且解說平台仍可供公眾使用，對社區導覽活動不致有影響。\n四、地方人士已持續溝通協調中，盼以社區共好為前提，給予社區居民方便通行及使用，惟仍需要時間溝通協商。"},{"s":"南投名間焚化爐選址爭議 環團籲停止二階環評並改址","a":"（中央社記者汪淑芬台北10日電）監督施政聯盟今天舉行記者會，指名間焚化爐案選址程序未完備，距預定地一、5公里處有淨水場，恐汙染飲用水源，呼籲應停止二階環評並重新選址。","u":"農村規劃組","d":"115/03/11","st":"存參","p":"農村規劃組於115.3.11回應。","k":"一、名間鄉為國內商用茶之主要產區(約2,218公頃)，占南投縣茶產量之1/2，亦占全國茶產量之1/3。其中取得茶產業產銷履歷驗證70公頃、有機驗證面積33公頃。此外，鄉內農產業多元，除有稻米產銷契作集團產區外，當地亦種植山藥、米、鳳梨等其他果樹，通過產銷履歷驗證總面積167公頃。由於農業為當地唯一產業，焚化廠設置倘有影響周邊農業及茶葉生產環境，將影響當地農民生計。由於特定農業區仍應優先以農業使用為主，縣府仍有興建焚化廠需求，建議應另覓其他適當場地設置。\n二、本案倘仍擬變更特定農業區設置，因本案屬應送中央區域計畫擬定機關審議之案件，依農變要點第13點第1項第1款規定，須由環境部收到縣府提報之農變說明書，並提出使用農地之必要性、合理性及無可替代性之支持意見，再徵詢農業部意見。\n三、由於當地自救會多次陳情焚化爐之設置，落塵影響當地茶園及果園安全、聯外道路寬度不足影響當地交通安全等議題，抗議聲浪嚴重，仍應請南投縣政府查明，並持續與當地居民溝通，以避免本案開發影響當地農民權益。\n四、本案環境部倘未針對本案使用特定農業區之必要性、合理性及無可替代性提出評估意見，並具體表示支持，依據農變要點第4點，原則不同意變更使用。"}]},{"m":"115年4月","n":10,"items":[{"s":"公地放領 立委陳瑩：山坡地認定僵化應檢討","a":"（中央社記者盧太城台東縣29日電）內政部宣佈重啟公地放領，山坡地遭排除。立委陳瑩表示，山坡地認定僵化，應檢討並回歸實際使用情形；早期土地管理機關移轉影響申請人權益，應建立一致、合理的審議標準。","u":"坡地管理組","d":"115/04/29","st":"存參","p":"坡地管理組於115.4.29回應。","k":"一、依水土保持法第3條第3款規定，係指國有林事業區、試驗用林地、保安林地，及經中央或直轄市主管機關參照自然形勢、行政區域或保育、利用之需要，就標高在100公尺以上或標高未滿一百公尺，而其平均坡度在百分之五以上者劃定範圍，報請行政院核定公告之公、私有土地。\n二、為檢討山坡地範圍之劃定標準，改制前行政院農業委員會101.4.24召開專家會議研商其妥適性，會中取得共識，山坡地範圍之劃定標準係依臺灣地形環境及防災需求所建立，現階段尚無全面修訂之必要。\n三、為因應地籍重測等原因，改制前行政院農業委員會於108年至111年完成各縣市山坡地範圍通盤檢討，後續各縣市如有檢討之需求，仍可依「農業部山坡地範圍劃定及檢討變更作業要點」規定，辦理個案檢討，但須符合水土保持及安全條件下，審慎評估調整可能性，以兼顧地方發展與土地權益。"},{"s":"《逾250位學者專家連署 呼籲停止興建名間焚化爐計畫 守住茶鄉農業經濟與文化資產》","a":"超過250位，來自海內外各大專院校系所，及研究機構的學者專家，提出反對設置焚化爐的論點，籲請南投縣政府即刻終止缺乏社會共識的環評程序。","u":"本署","d":"115/04/24","st":"存參","p":"本署於115.4.24回應。","k":"一、本次會議無立法委員出席，亦未邀請各行政機關列席，農村水保署依據記者會直播及書面資料，彙整主要訴求摘述如下：\n1.焚化爐設置將威脅國家糧食安全與特定農業區完整性，請南投縣政府重新審視此項決策。\n2.名間鄉為全台規模最大之茶產區，更為臺灣手搖文化重要的本土基底茶共應鏈，南投縣政府應守護百億產值與台灣手搖飲文化資產。\n3.為捍衛程序正義與環境韌性，請南投縣政府積極研議更具環境友善性，符合循環經濟原則的垃圾處理永續治理方案。\n二、本次記者會訴求主題，無涉農業部業務，惟後續仍持續關注南投焚化爐案相關議題，並適時回應及處理。"},{"s":"農村再生「產業活化」補助遭暫緩？ 農村水保署：資源重新配置 各縣市皆同","a":"雲林縣日昨舉辦「115年農村再生執行計畫修正說明會」，提及中央政策調整導致產業活化補助暫緩，縣府將自籌2,760萬元預算持續推動。農業部農村發展及水土保持署今（17）日澄清，相關措施並非停止或取消補助，而是調整「產業活化類」計畫推動方式，改由農村水保署各分署統籌規劃，避免資源重複投入或零散執行，這類計畫經費調整所有縣市皆同，不獨虧雲林縣。","u":"農村建設組","d":"115/04/18","st":"存參","p":"農村建設組於115.4.18回應。","k":"一、本件為本署電話受訪之澄清報導。\n二、有關產業活化類計畫即是社區產業的推廣與行銷，內容可包括規劃設計與行銷推廣，透過產業活化類計畫，促進社區產業活化與發展。此類計畫補助並未停止，本署希望進行階段性盤點與執行方式精進。考量各社區發展條件不同，若由單一社區各自提案，較難整合產業特色與串聯行銷資源；因此，改由各分署從區域整體角度進行統籌規劃，串聯鄰近社區、青年、實體場域與產業資源，期透過集中投入與整體設計，提升發展效益與成果能見度。\n三、因屬於延續型計畫，依預算法可先行辦理，本署於核定公文內皆會帶到「115年度基金預算尚未經立法院審議通過，屆時如經刪減或凍結，本署得調整計畫金額或配合調整撥款進度。」等文字。"},{"s":"農傳媒記者採訪案","a":"農傳媒游昇俯記者採訪於115年4月17日下午5點50分，以電話方式採訪農村建設組陳玲岑組長，採訪內容二大重點：一、產業活動計畫？停止的理由。二、為何立法院還没審預算，我們己核定計書。","u":"農村建設組","d":"115/04/17","st":"存參","p":"農村建設組陳玲岑組長於115.4.17回應。","k":"一、因應農村發展型態與資源配置需求，進行階段性盤點與執行方式精進。考量各社區發展條件不同，若由單一社區各自提案，較難整合產業特色與串聯行銷資源；因此，改由農村水保署各分署從區域整體角度進行統籌規劃，串聯鄰近社區、青年、實體場域與產業資源，期透過集中投入與整體設計，提升發展效益與成果能見度。\n二、因屬於延續型計畫，依預算法可以先行辦理，本署於核定公文內皆會帶到「115年度基金預算尚未經立法院審議通過，屆時如經刪減或凍結，本署得調整計畫金額或配合調整撥款進度。」等文字。"},{"s":"中央暫緩補助！雲林縣府自籌2760萬 接手126案農村再生計畫","a":"雲林縣政府16日舉辦農村再生計畫修正說明會，將自籌2760萬元補中央缺口。（張朝欣攝）","u":"農村建設組","d":"115/04/17","st":"發新聞稿-澄清","p":"農村建設組於115.4.17發布【澄清稿】農村水保署持續挹注經費推動農村再生，區域整合避免資源重複投入。","k":"【澄清稿】農村水保署持續挹注經費推動農村再生，區域整合避免資源重複投入：\n針對昨(16)日雲林縣政府表示「中央政策調整導致產業活化補助暫緩，將自籌經費補足中央缺口」，農業部農村發展及水土保持署澄清表示，相關措施並非停止或取消補助，而是因應農村發展型態與資源配置需求，進行階段性盤點與精進，透過區域整合規劃推動農村社區產業活化與行銷，將可避免資源重複投入或零散執行。\n農村水保持署指出，近3年平均每年投入6.21億元補助農村再生社區，其中補助雲林縣平均計0.82億元，今(115)年將進一步整合社區資源，統籌規劃地方產業活動，以擴大推動成效。\n農村水保署強調，中央對農村社區的預算支持從未中斷，今年度全國22縣市農村再生執行計畫核定補助總金額達5.49億元，共協助411個農村再生社區推動583件涵蓋生活環境與公共設施改善、文化保存與活用、生態保育等軟硬體計畫。其中，針對雲林縣的核定補助金額達4,860萬元，協助雲林縣政府推動轄內73個農村再生社區共計97件軟硬體建設，展現中央持續照顧農村基層需求之決心。\n針對外界關心「產業活化類」計畫之推動方式調整，農村水保署進一步說明，相關措施並非停止或取消補助，而是因應農村發展型態與資源配置需求，進行階段性盤點與執行方式精進。考量各社區發展條件不同，若由單一社區各自提案，較難整合產業特色與串聯行銷資源，因此，改由農村水保署各分署從區域整體角度進行統籌規劃，串聯鄰近社區、青年、實體場域與產業資源，期透過集中投入與整體設計，提升發展效益與成果能見度。\n農村水保署指出，以區域整合規劃來推動農村社區產業活化與行銷，可避免資源重複投入或零散執行，社區在既有基礎上，透過跨域合作，發展更具規模與延續性的產業營運模式。未來此類作法也將優先納入過去已有良好執行成果、地方投入度高的農村再生社區，作為重點示範推動。\n農村水保署重申，中央與地方在農村再生的目標上始終一致，對於雲林縣政府配合中央政策投入經費，農村水保署樂觀其成。未來將持續與各縣市政府及社區聯繫，滾動檢視社區活化推動重點與機制，落實社區組織運作，建構農村支持體系，並在中央與地方協力下，讓農村再生基金發揮最大綜效，落實永續農村願景。"},{"s":"徐榛蔚赴卓溪鄉石平部落 關心農路復建","a":"徐榛蔚赴卓溪鄉石平部落 關心農路復建","u":"花蓮分署","d":"115/04/15","st":"存參","p":"花蓮分署於115.4.15回應。","k":"一、過去治理概況：位於花縣DF041下游約2.3km，111年曾補助卓溪鄉公所執行「卓溪鄉石平野溪清疏工程」，經費90萬元。\n二、災害復建需求：114年11月鳳凰颱風造成護岸破損斷裂，預計修復護岸長100m，高度6m、路面長50m，路寬3m，固床工3座。\n三、工程提報情形：縣府災後向行政院提報「卓溪鄉石平部落護岸鳳凰風災復建工程」(G1類，提報經費23,088千元)。分署同年12月16日勘審，建議經費為10,725千元，工程會嗣於115年1月15日核定。\n四、後續審查流程：依據「公共設施災後復建工程經費審議及執行作業要點」規定，本案縣府應將基本設計圖說提報本署審查。縣府已於115年4月14日將預算書送達本署審查中。"},{"s":"土方之亂延燒3個月還在亂...專家曝三大原因 呼籲中央協調配套解方","a":"中央土方新制今年元旦上路，引爆各縣市「土方之亂」持續延燒。北市結構工程工業技師公會理事長徐茂卿點出三大問題，呼籲中央針對這些問題提解決配套，否則儘管新政立意良善，但民間腳步跟不上。","u":"農村規劃組","d":"115/04/12","st":"存參","p":"農村規劃組於115.4.12回應","k":"一、農地土壤係天然化育，農耕行為應適地適種，無大規模回填外來土石之必要。\n二、農地改良係以農業生產使用為目的，由個別農民因其農地為從事農業使用有填土之需要而提出申請，與營建剩餘土石方去化無關，係為二事，不宜混為一談。\n三、農地改良應向地方政府提出申請，填土土質應為適合種植農作物之土壤，不得為砂、石、磚、瓦、混凝土塊、營建剩餘土石方、廢棄物或其他不適合種植農作物之物質，且不因土地所在區位等因素而有不同，以確保整體農業生產環境安全。"},{"s":"挹注1151萬重建玉里源城溪護岸 徐榛蔚預計4月提送農業部審查","a":"花蓮縣玉里鎮源城溪因115年樺加沙颱風造成部分河川護岸受損，縣政府今（10）日表示，目前已積極推動重建工程，並已完成設計，將於本月將提送中央審查。花蓮縣長徐榛蔚也親赴玉里鎮現地會勘，確保各項工程設計貼合地方需要，督促團隊加速行政流程，感謝基層地方緊密合作，並冒雨守護家園，目前源城溪經費約為1151萬，預計將於4月提送農業部，待中央核定，力求盡速復健。","u":"花蓮分署","d":"115/04/10","st":"存參","p":"花蓮分署於115.4.8回應","k":"一、過去治理概況：本案下游緊鄰土石流潛勢溪流(花縣DF072)，另距離源城國小約1公里，經查為本署91年委辦縣府執行之「源城無尾溪護岸二期」，經費400萬元，竣工後由縣府維管。\n二、災害復建需求：114年9月樺加沙颱風豪雨造成既有護岸毀損2處，長度分別約50m及30m，岸高約3m。後續治理以重新施作護岸、增設並銜接防砂壩，以及一併處理支流坑溝，進行整體性結構補強與流路調整，以恢復河道穩定及保護功能為原則。\n三、工程提報情形：縣府災後向行政院提報「玉里鎮源城溪護岸樺加沙颱風災後復建工程」(G1類，提報經費9,326千元)。本分署同年11月10日勘審，因認定護岸沖毀嚴重，故調整工程內容及數量，建議經費提高為11,510千元，工程會嗣於12月9日核定。\n四、後續審查流程：依據「公共設施災後復建工程經費審議及執行作業要點」規定，本案縣府應將基本設計圖說提報本署審查。俟縣府將預算書送達後再辦理審查。"},{"s":"假租楊梅農地埋營建廢棄物，非法廢土集團33人起訴","a":"馬來西亞籍男子林家俊為首的犯罪集團，前年九月起在桃園市假借租地植栽等名義，涉嫌回填營建廢棄物達四萬多立方公尺，不法獲利逾四點二億元，檢方近日偵結，將林男等卅三人、七間公司依廢棄物清理法等罪嫌起訴，並對林求處四年以上徒刑。","u":"農村規劃組","d":"115/04/08","st":"存參","p":"農村規劃組於115.4.8回應。","k":"一、農地違規使用，依農發條例第69條規定，應送區域計畫法或都市計畫法主管機關，對違規者處6萬至30萬元罰鍰，並得限期恢復原狀、停止供水、供電、封閉、強制拆除、並得處六個月以下有期徒刑或拘役等措施。\n二、農地遭違法回填廢棄物行為，亦涉及違反事業法規及裁處作業，依「廢棄物清理法」第52條規定，最高處300萬元以下罰鍰；經限期改善而未改善者，得按次處罰。\n三、針對楊梅農地回填營建廢棄物，已由桃園市政府依廢棄物清理法規定裁罰並移送檢調在案，故農地違規回填廢棄物已有相關規範及罰則，如為遏止回填行為，應加強流向及使用管理規範，透過源頭管制方式，強化查察管理機制，以取締違規，並透過裁罰基準，遏止事業廢棄物回填農地。"},{"s":"雷雨胞強襲苗栗！高鐵停車場變池塘 土石流淹沒山路","a":"受到鋒面影響，苗栗降下破百大豪雨，現在已經造成多處地方積淹水，苗栗高鐵站附近停車場宛如池塘，山區還有土石流發生。▲苗栗高鐵站旁停車場淹水如池塘。（圖/翻攝Threads）","u":"減災監測組","d":"115/04/04","st":"存參","p":"減災監測組於115.4.4回應。","k":"一、受到鋒面影響，造成苗栗高鐵站附近停車場淹水，另苗栗縣南庄鄉 124乙縣道也出現土石崩落情況。\n二、有關苗栗縣南庄鄉124乙縣道土石崩落情形，經致電南庄鄉公所羅鄉長並表示：124乙縣道屬縣府權責，目前已由縣府開口廠商進行搶通中。\n三、另羅鄉長表示：鄉內苗20、21等鄉管道路亦有零星土石崩落災情，公所接獲村里長通報後，均已納入清除排程，目前刻正由南庒鄉公所開口廠商依道路權重進行搶通中。\n四、本災點（124乙縣道）非土石流、大規模崩塌範圍。\n五、本署及台中分署因應0404豪雨土石流及大規模崩塌災害緊急應變小組已於08時30分3級開設。並依據氣象情資於4日9:30發布土石流黃色警戒計3條，計於1縣(市)2鄉(鎮市區)3村(里)，分布於苗栗縣三灣鄉、南庄鄉。"}]},{"m":"115年5月","n":1,"items":[{"s":"苗栗縣府勘災車摔落4米深野溪 4人傷勢曝光","a":"苗栗縣政府農業處兩名職員於今日中午11點多會同及顧問公司人員，前往苗栗縣造橋鄉執行「0404 豪雨災後復建工程」的複勘作業時，行車途中發生意外，整輛車摔落4米深野溪，造成車上4人受傷。","u":"臺中分署","d":"115/05/12","st":"存參","p":"臺中分署於115.5.12回應。","k":"一、本署臺中分署同仁5月12日會同苗栗縣政府及顧問公司，為115年4月豪雨辦理公共設施災後復建勘災，已完成造橋鄉受損農路災後會勘 。\n二、返程途中，苗栗縣政府前導車輛因不明原因偏離路面，翻覆墜落約4公尺深溪谷。\n三、消防局於13時40分完成救援，車內4人受傷（縣府人員2員、顧問公司2員）均送往苗栗大千醫院，意識清楚且無生命危險；臺中分署勘災同仁均平安。\n四、後續處置：本署持續關心受傷同仁治療情形，並已請各分署所有同仁及團隊注意，務必加強山區勘查作業之安全管理與風險評估。"}]},{"m":"115年6月","n":6,"items":[{"s":"竹北博愛街淹水釀滅頂憾事 民代指排水權責「行政三不管」","a":"竹北昨不幸受困洪水殞命的黃姓女子座車，在圖中黑圈處、鳳山溪支流旁被「撈起」。搜救人員說，當時現場是一片「池塘」。（圖由竹縣府消防局提供）","u":"臺北分署","d":"115/06/29","st":"存參","p":"臺北分署於115.6.29回應。","k":"一、有關媒體報導竹北市博愛街豪雨積淹水事件，提及鳳山溪支流、農田野溪及管理權責等議題，本分署已查證相關位置、山坡地範圍及經濟部公告河川治理界點資料。\n二、經查，本案所在地位於非山坡地範圍；鳳山溪屬中央管河川，媒體所稱鳳山溪支流依經濟部(113.10.30經授水字第11360019731號)公告河川治理界點資料，位於治理界點以下，非屬本署依法辦理之山坡地野溪治理範圍。\n三、本署依《水土保持法》辦理山坡地野溪治理，並以經濟部公告河川治理界點作為河川與野溪治理權責劃分依據；現行法令及本署業務並無「農田野溪」之權責分類，相關治理及管理權責仍應由主管機關依相關法令認定。\n四、應辦事項：本分署將配合本署及相關主管機關提供河川治理界點及相關資料，協助釐清權責疑義。"},{"s":"南橫荖濃溪清淤 拚8月完成發包","a":"颱風汛期步步逼近，為了解決高雄桃源區台廿線南橫公路沿線的荖濃溪河床嚴重淤積、危及道路與農地安全的燃眉之急，立委林岱樺召開跨部會協商會議，決定「朝向八月完成發包的目標全力衝刺」。","u":"臺南分署","d":"115/06/25","st":"存參","p":"臺南分署於115.6.30回應。","k":"一、有關自由時報報導農村水保署已依規劃在荖濃溪河川界點以上，鎖定總清疏量118萬立方公尺、總經費逾1億元的目標，確保工程如期完成。\n二、經查所提清疏工程為已核定之瓦阿係吊橋上下游清疏、瓦阿係吊橋下游河道清疏、拉庫斯溪復興橋上游清疏二期、拉庫斯溪出流口緊急清疏、清水溪野溪清疏、布唐布那斯溪與荖濃溪匯流口清疏等6件，目前除瓦阿係吊橋上下游清疏(區公所正簽辦上網)及布唐布那斯溪與荖濃溪匯流口清疏(區公所正辦理用地取得中)尚未發包外，其餘4件工程均已在施工中。\n三、有關中央社報導拉庫斯溪與荖濃溪交界處，地方爭取施作600公尺的護岸工程，經查區公所尚未提報計畫，臺南分署將俟區公所提報計畫後辦理現勘作業。\n四、應辦事項：本案清疏工程及區公所將提報之工程，臺南分署將協助桃源區公所辦理。"},{"s":"3大關鍵法令可救保育生態 農業部挨批裝死不作為","a":"前年9月，南投縣政府宣佈將在名間鄉新民村興建一座「垃圾處理及再生能源中心」，也就是大型垃圾焚化爐，消息一出，立刻引發居民強烈反彈，因為當地是茶葉產區及水源地，大家都很擔心，焚化爐會汙染空氣及水源，但縣府不願妥協，持續推動開發案，也辦理多場說明會，但仍無法消除居民的疑慮。","u":"本署","d":"115/06/15","st":"發新聞稿-澄清","p":"本署於115.6.15發澄清新聞稿。","k":"【澄清稿】針對媒體今(15)日報導「南投縣政府預計於名間鄉興建焚化爐」議題，農業部重申，名間鄉為國內茶葉重要生產區，也是石虎等重要野生動物棲地；目前農業部尚未收到名間鄉焚化爐農業用地變更案件相關資料，如果後續進入農地變更程序，將堅守必要性、合理性及不可替代性三原則嚴格把關，以確保農業生產環境與生態棲地安全。\n有關報導指出農業部可依據相關法規予以否決該案，農業部表示，名間鄉焚化爐設置位置為特定農業區農業用地，係屬優良農地範圍，依據現行開發審議行政程序，該農地若要變更作為焚化爐使用，南投縣政府需取得環評審查同意、農地變更同意，並經內政部區委會開發審議同意，才能進行開發利用。有關該三項審議作業，對於民眾提出影響茶葉生產環境、水源安全、石虎生態棲地等議題，將會納入相關審議評估，農業部支持相關審議皆應嚴審民眾所提出之相關疑慮。\n農業部再次強調，倘後續收到南投縣政府申辦名間鄉焚化爐農業用地變更案件相關資料，鑒於該地區為國內重要之茶葉生產地區，亦為石虎等重要保育類動物棲地，農業部會考量當地民眾及相關團體意見，審慎做出評估及建議，以維護農地資源及珍貴野生動物棲息環境。"},{"s":"有關「我是南投人」臉書訊息張貼南投縣政府維管之投89線(仁愛鄉力行道路)發生崩塌，道路交通中斷","a":"南投的雨水是不是不用錢啊？豪雨狂炸連日來，力行產業道路又雙叒叕撐不住了！","u":"南投分署","d":"115/06/14","st":"存參","p":"南投分署於115.6.14回應。","k":"【災情時間】115/6/14 14:00\n【災情地點】南投縣仁愛鄉(TWD97:266475.6,2663538.6)\n【災情概述】\n一、受近日降雨影響，仁愛鄉力行產業道路投89線18.2K、36.5K、46K處邊坡發生崩塌，落石掉落阻礙道路，導致交通中斷。\n二、經電話聯繫仁愛鄉公所及發祥村全芊蕙村長，縣府緊急搶修搶險廠商已進行道路搶修通，目前道路暢通。\n三、本災點非土石流潛勢溪流。\n【涉及權責單位】南投縣政府、仁愛鄉公所\n一、投89線為鄉道(2008年12月提升為鄉道)，屬縣府權責。\n二、本道路災害類型均為上下邊坡崩塌，因屬不可分割範圍，因此均為道路主管機關權責，近15年均未投入相關治理經費。\n三、因地質破碎，災害不斷，縣府112年卡努颱風迄今已爭取行政院核定C1類公路系統(公路局審議)災害復建工程共20件，辦理上下邊坡整治及路面改善等工程。"},{"s":"山坡地違法開挖雨後成水池 苗栗居民憂泥流災情重演","a":"梅雨鋒面接連報到，對苗栗通霄榮華社區的居民來說，可是提心吊膽，因為今（2026）年4月4日的強降雨，社區後方違法開挖的山坡地，引發泥流沖入民宅；事隔2個月進入梅雨季，住戶發現開挖的坑洞變成大水池，擔心災情重演。目前苗栗縣政府緊急調派怪手挖掘引水道，但居民認為這根本治標不治本，甚至有住戶被嚇到，用鐵板把家裡的後門直接封死，就怕土石再度沖進家園。","u":"臺中分署","d":"115/06/12","st":"存參","p":"臺中分署於115.6.12回應。","k":"一、本案經洽苗栗縣政府表示，違法地號位於苗栗縣通霄鎮南華段1429、1444、1445、1446、1447、1448、1449等地號，非屬山坡地範圍。\n二、本案違反土地使用管制，係由該府地政處依都市計畫法裁罰，112.7.31裁罰6萬元、114.10.15裁罰15萬元、115.4.10裁罰45萬元，共計66萬元。\n三、民眾陳情事項，由縣府水利處115.6.9進場代為履行設置洩水道，並於同日移送地檢署偵辦。\n四、應辦事項：本案非屬山坡地範圍，尚無本署需辦理事項。"},{"s":"南投客家電視台李永盛記者詢問保甲林溪工程整治情形及本次豪雨的因應作為以及土石流監控狀況，南投分署於115年6月10日12時40分在南投分署防災中心錄製影片提供給記者。","a":"採訪內容：保甲林溪工程整治情形及本次豪雨的因應作為以及土石流監控狀況","u":"南投分署","d":"115/06/10","st":"存參","p":"南投分署傅桂霖分署長於115.6.10提供影像資料。","k":"一、保甲林溪工程整治情形:\nDF185保甲林溪是位於南投縣信義鄉明德村及水里鄉上安村交界，因113年凱米颱風強降雨造成當地重大土砂災害，本分署立即於該區進行3件整治工程，並已陸續施作完成，目前河道水流暢通。\n二、針對本次0608豪雨的因應作為:\n目前持續加強該區的防災守視，除了汛期前於3月27日與地方鄉鎮長進行首長會談，水保署長官亦於5月20日現場視察；現場架置土石流CCT影像，可即時觀測現況，隨時監控並掌握現場情況立即應變。"}]},{"m":"115年7月","n":6,"items":[{"s":"露營場合法化卡關 南投縣長許淑華喊話中央鬆綁法規","a":"全國約有1700多家露營場，苗栗縣和南投縣即占約4成，南投縣長許淑華今天（22日）在兩縣露營場合法化輔導交流活動說，目前各縣市露營場申設通過比例不甚理想，主因在於營位設施用地使用容許比例一直無法突破，需要各地方政府持續向中央發聲，爭取放寬規範，才能讓露營產業永續發展。","u":"坡地管理組","d":"115/07/23","st":"存參","p":"坡地管理組於115.7.23回應。","k":"一、交通部111年訂定「露營場管理要點」規範露營場面積不超過1公頃，容許設置露營設施面積不超過全區10%，並以660平方公尺為限。但配合露營業者反應之相關意見，農業部已積極配合交通部陸續修正放寬多項法令規定，包括：(1) 農牧用地露營設施高度由3公尺放寬至4公尺、(2)得增設區內通路面積不超過露營場面積5%、(3)活動式露營帳篷免計入營位設施面積、(4)露營場申請範圍之審查許可與露營場範圍外的其他既有設施，脫鉤處理、(5)新增公告水保計畫「露營場適用」之簡化格式，以兼顧法規與業者營運需求。\n二、對於位於環境敏感地區得否設置露營場，行政院於114年6月4日召開會議討論後，基於安全考量，仍決定19項環境敏感地區 (如特定農業區、特定水土保持區、土石流潛勢溪流及其流域範圍)等環境敏感地區，尚不放寬設置露營場。\n三、有關露營場業者之訴求，本署將持續參加交通部觀光署相關跨部會研商會議，持續積極協助研析精進措施，共同協助輔導露營場業者合法化。"},{"s":"驚悚空拍畫面曝光「上千噸巨石崩落」大貨車遭擠壓推斷崖","a":"受巴威颱風來襲連日豪雨影響，苗栗山區驚傳恐怖坍方意外！苗栗縣大湖鄉「苗62線」2.5公里處，昨(13)日深夜10時許發生邊坡坍方事故，大量巨石與土石流傾瀉而下，造成雙向交通中斷，驚險的事，有名46歲羅男當時駕駛大貨車行經該路段，突然坍方的巨大落擊中，導致大貨車嚴重受損，人車險遭活埋，所幸駕駛命大，意識清醒、生命徵象穩定，傷勢無大礙未送醫。","u":"臺中分署、減災監測組","d":"115/07/14","st":"存參","p":"臺中分署於115.7.14回應。","k":"一、本案位於苗栗大湖鄉富興村苗62線道路2.5K處，於13日晚間再度發生道路上邊坡崩塌，大量落石將一輛行經的大貨車推擠至懸崖邊，造成駕駛擦傷，道路中斷。經查詢苗栗大湖鄉公所，目前已由苗栗縣政府於今（14）日派遣開口契約廠商進行搶通作業。\n二、經查本次災情崩塌地點為山坡地保育區林業用地，苗栗縣政府曾於110年辦理「大湖鄉苗62線2K+100段道路復建工程(4886.3萬元)」，本次災情後續由苗栗縣政府提報災害復建工程(C1：屬公路系統工程)。\n三、本災點非為土石流或大規模崩塌範圍。"},{"s":"巴威釀新竹部落聯外道路中斷尖石鄉約百處路面受損","a":"巴威颱風侵襲，新竹縣尖石鄉出現災情，司馬庫斯和石磊部落聯外道路尤其嚴重。同樣受災嚴重的還有桃園市復興區，巴威颱風在石門水庫集水區帶來豐沛雨量，總入流量約2.2億噸，相當於一座石門水庫的蓄水量，但瞬間大雨也讓水庫工作船受災嚴重，沉了十幾艘，現在還無法打撈上岸。","u":"臺北分署、減災監測組","d":"115/07/13","st":"存參","p":"臺北分署於115.7.13回應。","k":"一、本次巴威颱風造成新竹縣尖石鄉的災情嚴重，道路受損部份已經由新竹縣尖石鄉公所進行搶通修作業，經115年7月14日聯繫尖石鄉公所劉德華課員表示，大部分已經搶通。\n二、桃園市復興區山區道路災害，經聯繫公所皆已完成大部分搶通修作業。\n三、前開災害擬由尖石鄉公所循序報請中央災害復建計畫，復興區公所則報請桃園市政府災害準備金進行災後復建，臺北分署亦將協助勘災，原則上部落聯外道路尖石鄉及復興區權屬原民會，如有需求，後續再依公所提報內容進行協助。\n四、應辦事項：無"},{"s":"新竹秀巒「大規模山崩」 500人受困 憂斷電斷糧","a":"巴威颱風侵襲，新竹秀巒村發生大規模山崩！大量土石瞬間往下沖，導致竹60線中斷，司馬庫斯、泰崗部落、還有錦路部落等等，瞬間成為孤島，至少五百人受困。秀巒居民告訴我們，親戚現在都還在山上，斷電之後，網路越來越差，就怕會失聯，她心急如焚。","u":"臺北分署、減災監測組","d":"115/07/11","st":"存參","p":"臺北分署於115.7.11回應。","k":"一、媒體報導新竹尖石鄉秀巒村發生大規模山崩，土石阻斷聯外道路竹60線，導致上方的司馬庫斯等部落淪為孤島，至少500人受困。\n二、新聞中所稱之秀巒大崩塌既有坡趾堆積土砂發生局部崩滑，業已透過CCD攝影機畫面確認土砂遭白石溪洪水沖走，並無阻斷河道及道路。\n三、本分署另聯繫新竹縣政府災害應變中心查證確認係新竹縣尖石鄉竹60線道路上邊坡多處（三、5K、26K及30K）崩塌導致通往後山唯一道路阻斷，且已於今日下午恢復單線通車，並無部落淪為孤島及居民受困之情事。\n四、該新聞台多起事件一起報導，卻下標題張冠李戴將停電等事由歸因秀巒大規模山崩，除言過其實，亦實屬誤導觀眾。\n五、應辦事項：本案尚無本署權責。"},{"s":"強颱巴威逼近！雙溪山坡地赤皮崙居民憂「土石流」毀家園","a":"強颱巴威逼近！住在新北市雙溪赤皮崙的居民，擔心歷經颱風與豪雨的山坡地，已經接連坍塌，就怕這次的暴風圈靠近，災情重演，嚴重土石流，沖毀家園。區公所回應，搶災工班已經在現場待命，山區住戶也都納入列管，若宣佈土石流紅色警戒就會強制撤離。","u":"臺北分署","d":"115/07/09","st":"存參","p":"臺北分署於115.7.9回應。","k":"一、有關媒體報導114年1020豪雨造成新北市雙溪區北38線4k~7k邊坡崩塌，居民憂心巴威颱風侵臺期間災情重演議題，本分署已查證相關位置、鄰近土石流潛勢溪流及大規模崩塌潛勢區等資料。\n二、經查，本案災點於113年山陀兒颱風期間已發生崩塌災害，1020豪雨期間，新北市政府工務局養護工程處執行「114年度新北市轄區內災害緊急搶修及復健工程（第1區）雙溪區北38線5k+100上邊坡復健工程」已接近完工，惟受1020豪雨影響，既有災區擴大，並影響北38線沿線居民及電塔等設施。\n三、新北市府工務局114年11月24日邀集各相關單位研商權責，決議請新北市府依公共工程委員會公共設施災後復建工程經費審議及執行作業要點併前期調查監測成果提報後續災害復建經費。\n四、經洽詢新北市政府工務局養護工程處，未獲得工程會同意災害復建工程經費追加，目前已完成緊急搶通作業，並於部分坡面施作加固工程（預計115年7月20日完工），後續仍有坡面排水工程需執行；目前因應巴威颱風可能造成之影響，已安排兩組工班及機具於現場待命。\n五、本案災點經查無鄰近土石流潛勢溪流及327處大規模崩塌潛勢區。災害型態為縣市管道路邊坡崩塌，權責單位為道路主管機關（新北市政府工務局）\n六、應辦事項：本案尚無本署權責"},{"s":"中央社記者採訪案","a":"中央社記者於115.7.9 下午3點30分以電話採訪減災監測組陳振宇組長，採訪內容：詢問日前民視新聞報導之 AI 土石流辨識，是否已應用於土石流警戒發布，以及其實際用途。","u":"減災監測組","d":"115/07/09","st":"存參","p":"減災監測組陳振宇組長於115.7.9回應","k":"一、說明本署目前發展之 AI 影像辨識，主要係用於輔助防災值勤與監測作業，協助本署防災人員降低 24 小時持續觀看 CCD 影像之負擔。當 CCD 影像出現明顯變化時，AI 模組可協助初步察覺，並通報工程師進一步確認。\n二、另說明目前土石流紅、黃警戒發布，仍主要係依據降雨量及「以降雨為基礎之警戒基準值」辦理。CCD 影像目前主要作為災害現象觀察、土石流實際發生時間確認及事件後檢討之參考，並可作為日後雨量警戒值調整之重要參據，尚非直接作為土石流紅、黃警戒發布之主要依據。"}]},{"m":"115年8月","n":1,"items":[{"s":"南庄鄉301農路搶通後再度崩塌 縣府邀中央3機關現勘研議","a":"苗栗縣府農業處10日邀集農業部水保署、林保署、原民會及南庄鄉公所等共同現勘，針對道路復建、坡面穩定、水土保持、農民通行及農產品運輸等問題交換意見，研議後續處理方向。（苗栗縣政府提供╱謝明俊苗栗傳真）","u":"臺中分署","d":"115/08/10","st":"存參","p":"臺中分署：臺中分署於115.8.10現勘後回應。","k":"一、有關301農路搶通部分，請南庄鄉公所辦理，如再有崩塌中斷情形，仍請公所持續搶通，以利民眾通行，另如有颱風豪雨情況，請管制出入。\n二、縣府將評估搶通後是否搭鋼便橋，避免因崩塌造成農路中斷，後續將辦理災害復建整體治理評估方案。\n三、苗栗縣政府已向行政院工程會提報4,300萬元天然災害復建工程經費。"}]}];

   :`農地光電採「農業為本、綠能加值」為主軸，優先推動農業設施屋頂型太陽光電，再逐步發展地面型漁電共生；應符合「農業主管機關同意農業用地變更使用審查作業要點」規定；109年修正農變要點，限制特定農業區及養殖漁業生產區不得變更作太陽光電使用，未達2公頃農地不同意變更。農舍：申請者應為農民，104.9.4修法明定矩形配置臨側臨路，年度稽查應達前一年度使照件數30%。農地違規使用依農發條例第69條及區計法第21條、都計法第79條處理（6萬至30萬元罰鍰），涉山坡地者依水保法第33條裁罰。`},
 {t:"近期外界關注輿情",s:"news",news:1,b:()=>""}
];

/* ===================================================================== */
let V="v6";
const $=s=>document.querySelector(s);
function go(p){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));
  document.querySelectorAll("section.page").forEach(s=>s.classList.toggle("show",s.id==="p-"+p));
  window.scrollTo({top:0});
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));
function tog(el){el.classList.toggle("open")}

function setVersion(v){
  V=v;
  $("#verSel").value=v;
  const ver=VERS[VIDX[v]];
  $("#verCut").textContent="資料截至 "+ver.cut+"｜文件日期 "+ver.label;
  renderAll();
}
function renderAll(){renderUpd();renderBiz();renderKPI();renderBud()}

/* 本期更新數據：依前期比較自動產生——
   (1) 數值變動：本期與前一期皆有收錄且數值不同者，列出前期→本期
   (2) 本期新增揭示：前一期未收錄、本期首次收錄之數據
   僅比對已收錄之正式數據，不做推測 */
function updFmt(it,val){
  if(!it.updLab||val===undefined||val===null)return val;
  const parts=String(val).split("・");
  return parts.map((x,i)=>(it.updLab[i]||"")+x+(it.unit||"")).join("、");
}
function renderUpd(){
  const pi=VIDX[V]-1, pv=pi>=0?VERS[pi].id:null;
  let changed=[],added=[];
  GROUPS.forEach(G=>G.items.forEach(it=>{
    const cur=it.vals[V];
    if(cur===undefined)return;
    const prev=pv?it.vals[pv]:undefined;
    if(pv&&prev===undefined)added.push(it.lab);
    else if(pv&&prev!==cur)changed.push(`${it.lab}：${updFmt(it,prev)} → ${updFmt(it,cur)}${it.updLab?"":(it.unit||"")}`);
    else if(pv&&it.mini&&typeof it.mini!=="string"){
      const pm=it.mini[pv]||"",cm=it.mini[V]||"";
      if(pm&&cm&&pm!==cm)changed.push(`${it.lab}：${cur}${it.unit||""}（${pm.split("・").join("、")} → ${cm.split("・").join("、")}）`);
    }
  }));
  let html='<b style="color:var(--navy);font-size:.9rem">本期更新數據</b><div class="mini">與前一期（'+(pv?VERS[pi].label:"—")+'）比較自動彙整</div>';
  if(!pv)html+='<div style="font-size:.88rem;margin-top:4px">本年度首期，無前期可比較。</div>';
  else{
    html+=changed.length?'<ul>'+changed.map(c=>'<li>'+c+'</li>').join('')+'</ul>':'<div style="font-size:.88rem;margin-top:4px">本期關鍵數據與前期無變動。</div>';
    if(added.length)html+='<div style="font-size:.84rem;margin-top:4px"><b style="color:var(--navy)">本期新增揭示：</b>'+added.join('、')+'</div>';
  }
  $("#updbar").innerHTML=html;
}
/* 業務查詢 */
function renderBiz(){
  $("#bizList").innerHTML=BIZ.map((x,i)=>x.news
   ?`<div class="card acc" onclick="tog(this)" style="grid-column:1/-1">
      <div class="head"><h3>${x.t} <span class="badge na">${newsLabel()}</span></h3><span class="chev">▶</span></div>
      <div class="body" onclick="event.stopPropagation()">
        <div id="newsList"></div>
        <span class="src" onclick="showSrc('news')">📎 查看資料來源</span>
      </div></div>`
   :`<div class="card acc" onclick="tog(this)">
      <div class="head"><h3>${x.t}</h3><span class="chev">▶</span></div>
      <div class="body">${x.b(V)}<br><span class="src" onclick="event.stopPropagation();showSrc('${x.s}')">📎 查看資料來源</span></div></div>`).join("");
  renderNews();
}
/* 近期輿情：隨「資料版本」對應之資料月份呈現（一次僅一個月份），內容完整不截斷 */
function nl(t){return t?("<div>"+t.split("\n").join("</div><div>")+"</div>"):""}
function newsGroup(){const m=NEWSMAP[V];return m?NEWS.find(x=>x.m===m):null}
function newsLabel(){
  const m=NEWSMAP[V],g=newsGroup();
  if(!m)return "本期資料未收錄";
  let lab=m+"・"+(g?g.n:0)+" 則";
  if(VIDX[V]===VERS.length-1){
    const known=Object.values(NEWSMAP);
    const later=NEWS.filter(x=>!known.includes(x.m));
    if(later.length)lab+="（另 "+later.map(x=>x.m+" "+x.n+" 則").join("、")+"）";
  }
  return lab;
}
function renderNews(){
  const list=$("#newsList");if(!list)return;
  const m=NEWSMAP[V],g=newsGroup();
  if(!m){list.innerHTML='<div class="mini">本期資料未收錄——輿情紀錄依所選資料版本之資料月份呈現。</div>';return}
  let html="";
  /* 若為最新版本，先列尚無對應筆記本版本之後續月份（新→舊） */
  if(VIDX[V]===VERS.length-1){
    const known=Object.values(NEWSMAP);
    const later=NEWS.filter(x=>!known.includes(x.m)).slice().reverse();
    later.forEach(g2=>{
      html+=`<div class="laterBox"><div class="lh">${g2.m}　<span class="badge na">尚無對應筆記本版本・資料陸續更新中</span></div>`+
            g2.items.map(it=>newsItem(it)).join("")+`</div>`;
    });
  }
  html+=g&&g.items.length
   ?`<div class="mini" style="margin:10px 0 8px">資料月份 ${m}（共 ${g.n} 則）</div>`+g.items.map(it=>newsItem(it)).join("")
   :`<div class="mini">${m}無輿情紀錄</div>`;
  list.innerHTML=html;
}
function newsItem(it){
  return `<div class="newsItem">
      <div class="nh"><b>${it.s}</b></div>
      <div class="nm">${it.d}｜${it.u}｜${it.st}</div>
      ${it.a?`<div class="na2"><b>報導摘要</b>${nl(it.a)}</div>`:""}
      <div class="nk"><b>回應重點</b>${nl(it.k)}</div>
      ${it.p?`<div class="np">${nl(it.p)}</div>`:""}
    </div>`;
}

/* KPI 卡（含前期比較） */
function kpiCard(it){
  const val=it.vals[V]!==undefined?it.vals[V]:null;
  if(val===null)return `<div class="card kpi"><div class="lab">${it.lab}</div>
    <div class="num" style="font-size:.95rem;color:var(--muted)">本期資料未收錄</div></div>`;
  const pi=VIDX[V]-1, pv=pi>=0?VERS[pi].id:null;
  const pval=pv&&it.vals[pv]!==undefined?it.vals[pv]:null;
  let tr;
  if(pv===null)tr='<div class="trend flat">首期</div>';
  else if(pval===null)tr='<div class="trend flat">首期收錄</div>';
  else if(pval===val){
    const pm=it.mini&&typeof it.mini!=="string"?(it.mini[pv]||""):"";
    const cm=it.mini&&typeof it.mini!=="string"?(it.mini[V]||""):"";
    tr=(pm&&cm&&pm!==cm)?`<div class="trend chg">前期（${VERS[pi].label}）：${pm}</div>`:'<div class="trend flat">與前期相同</div>';
  }
  else tr=`<div class="trend chg">前期（${VERS[pi].label}）：${pval}${it.notes&&it.notes[V]?'・'+it.notes[V]:''}</div>`;
  const mini=it.mini?(typeof it.mini==="string"?it.mini:(it.mini[V]||"")):"";
  return `<div class="card kpi"><div class="lab">${it.lab}</div>
    <div class="num mono">${val}${it.unit?' <small>'+it.unit+'</small>':''}</div>
    ${mini?'<div class="mini">'+mini+'</div>':''}${tr}
    <span class="src" onclick="showSrc('${it.src}')">📎 查看資料來源</span></div>`;
}
function renderKPI(){
  $("#kpiGroups").innerHTML=GROUPS.map(G=>
   `<div class="grp">${G.g}</div><div class="grid g4">`+G.items.map(kpiCard).join("")+`</div>`).join("");
}
/* 預算執行（隨版本對應月份，與前月比較） */
function renderBud(){
  if(!BUDMON[V]){
    $("#budCard").innerHTML=`<div style="font-size:.88rem;color:var(--muted)">本期資料未收錄——預算執行附錄一自 115/05/13 版起提供（對應 115 年 4 月底起）。</div>`;
    return;
  }
  let pv=null;for(let i=VIDX[V]-1;i>=0;i--){if(BUDMON[VERS[i].id]){pv=VERS[i].id;break}}
  $("#budCard").innerHTML=`<div class="mini" style="margin-bottom:10px">統計月份：${BUDMON[V]}${pv?"（與前月比較）":""}｜深藍條＝執行率、金色條＝達成率；荖濃溪防災韌性計畫依標記剔除不列入。</div>`+
  BUD.map(r=>{
    const a=r.ach[V];
    if(a===undefined)return `<div class="budRow"><div class="t"><span>${r.n}</span><span class="badge na">本期資料未收錄</span></div></div>`;
    const pa=pv?r.ach[pv]:undefined;
    const d=(pa!==undefined)?(a-pa).toFixed(2):null;
    const e=r.exe&&r.exe[V]!==undefined?r.exe[V]:null;
    const pe=(pv&&r.exe&&r.exe[pv]!==undefined)?r.exe[pv]:null;
    const de=(e!==null&&pe!==null)?(e-pe).toFixed(2):null;
    const dl=d?`<span class="delta ${d>=0?'':'dn2'}">較前月 ${d>=0?'+':''}${d}%</span>`:'';
    const el=de?`<span class="delta ${de>=0?'':'dn2'}">較前月 ${de>=0?'+':''}${de}%</span>`:'';
    return `<div class="budRow">
      <div class="t"><span>${r.total?'<b>'+r.n+'</b>':r.n}${r.goal?'　<span class="mini">目標 '+r.goal+'%</span>':''}</span></div>
      ${e!==null?`<div class="t" style="font-size:.8rem"><span class="mini">執行率</span><b class="mono" style="color:var(--navy)">${e.toFixed(2)}% ${el}</b></div>
      <div class="bar"><i style="width:${Math.min(e,100)}%"></i></div>`:""}
      <div class="t" style="font-size:.8rem;margin-top:4px"><span class="mini">達成率</span><b class="mono" style="color:var(--navy)">${a.toFixed(2)}% ${dl}</b></div>
      <div class="bar"><i class="gold" style="width:${Math.min(a,100)}%"></i></div>
    </div>`;
  }).join("")+`<span class="src" onclick="showSrc('bud')">📎 查看資料來源</span>`;
}
/* 來源面板 */
function showSrc(key){
  const s=SRC[key];if(!s)return;
  if(key==="news"){
    $("#mBody").innerHTML=`<h4>📎 資料來源</h4>
     <div class="row"><b>文件名稱</b><span>近期輿情回應115年1月至7月(更新至0811).xlsx</span></div>
     <div class="row"><b>資料期間</b><span>115年1月13日至8月10日</span></div>
     <div class="row"><b>資料類型</b><span>輿情回應紀錄</span></div>
     <div class="row"><b>所屬章節</b><span>${s.sec}</span></div>
     <div class="ex">「${s.ex}」</div>`;
    $("#modalBg").style.display="block";$("#modal").style.display="block";return;
  }
  const ver=VERS[VIDX[V]];
  const pg=PG[key]?PG[key][V]:undefined;
  $("#mBody").innerHTML=`<h4>📎 資料來源</h4>
   <div class="row"><b>文件名稱</b><span>${key==="bud"?ver.doc+"（附錄一）":ver.doc}</span></div>
   <div class="row"><b>文件日期</b><span>${ver.label}</span></div>
   <div class="row"><b>資料類型</b><span>署長筆記本</span></div>
   <div class="row"><b>資料版本</b><span>${ver.label}（涵蓋 ${ver.data}，截至 ${ver.cut}）</span></div>
   <div class="row"><b>所屬章節</b><span>${s.sec}</span></div>
   <div class="row"><b>頁碼</b><span>${pg!==undefined?("第 "+pg+" 頁"):"—（該檔無頁碼或本版未標示）"}</span></div>
   <div class="ex">「${s.ex}」</div>`;
  $("#modalBg").style.display="block";$("#modal").style.display="block";
}
function closeSrc(){$("#modalBg").style.display="none";$("#modal").style.display="none"}
document.addEventListener('touchstart',function(){},{passive:true});

/* 初始化 */
VERS.forEach(x=>$("#verSel").add(new Option(x.label+"（"+x.data+"）",x.id)));
setVersion("v7");
</script>
